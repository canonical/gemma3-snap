name: amd-gpu
description: "Use ROCm for inference on AMD GPUs. Supported architectures: gfx908;gfx90a;gfx1030;gfx1100;gfx1101;gfx1102;gfx1150"
vendor: Canonical Ltd
grade: devel
devices:
  allof:
    - type: cpu
      architecture: amd64
    - type: gpu
      vendor-id: 0x1002 # AMD Corporation
memory: 1G
disk-space: 10G
components:
  - llamacpp-rocm
  - model-4b-it-q4-0-gguf
  - mmproj-f16-4b-gguf
configurations:
  sleep-idle-seconds: 600
