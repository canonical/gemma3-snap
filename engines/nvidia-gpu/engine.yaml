name: nvidia-gpu
description: Use CUDA for inference on Nvidia GPUs
vendor: Canonical Ltd
grade: stable
devices:
  allof:
    - type: gpu
      vendor-id: 0x10de # Nvidia Corporation
  anyof:
    - type: cpu
      architecture: amd64
    - type: cpu
      architecture: arm64

runtime: llamacpp-cuda

model:
  default: 4b-it-q4-0-gguf
  options:
    - 270m-it-q4-0-gguf
    - 4b-it-q4-0-gguf

configurations:
  sleep-idle-seconds: 600
