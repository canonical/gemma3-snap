name: amd-gpu-amd64
description: Use ROCm for inference on AMD GPUs
vendor: Canonical Ltd
grade: stable
devices:
  allof:
    - type: cpu
      architecture: amd64
    - type: gpu
      vendor-id: 0x1002 # AMD Corporation
memory: 1G
disk-space: 10G
components:
  - llamacpp-rocm
  - model-4b-it-q4-0-gguf
  - mmproj-f16-4b-gguf
configurations:
  sleep-idle-seconds: 600
