name: Build main branch

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      perform-tests:
        description: Run tests after build
        required: true
        type: boolean
        default: false

jobs:
  build-and-publish:
    uses: canonical/inference-snaps-dev/.github/workflows/build-publish-snap.yaml@v2
    strategy:
      fail-fast: false
      matrix:
        runner:
          - [ self-hosted, amd64, noble, large ]
          - [ self-hosted, arm64, noble, large ]
    with:
      runner: "${{ toJSON(matrix.runner) }}"
      init-build-script: 'prepare-models.sh'
      publish-channel: 'latest/edge' # Add track if needed, e.g., 24/latest/edge
    secrets:
      store-credentials: ${{ secrets.STORE_LOGIN }}

  test:
    needs: [build-and-publish]
    if: github.event_name == 'push' || inputs.perform-tests == true
    uses: ./.github/workflows/testflinger-tests.yaml
    with:
      snap-channel: 'latest/edge'
