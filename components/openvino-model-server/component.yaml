servers:
  openvino:
    protocol: http
    base-path: /v1
  kserve:
    protocol: http
    base-path: /2
  openai:
    protocol: http
    base-path: /v3

environment:
  # Add OVMS binaries
  - PATH=$PATH:$COMPONENT/bin
  # Add staged shared objects
  - LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$COMPONENT/lib
  - LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$COMPONENT/usr/lib/$ARCH_TRIPLET
  - LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$COMPONENT/usr/local/lib
  - LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$SNAP/usr/local/lib
  # Add Python dependencies
  - PYTHONPATH=$PYTHONPATH:$COMPONENT/lib/python # part of ovms package
  - PYTHONPATH=$PYTHONPATH:$COMPONENT/lib/python3.12/site-packages
  
